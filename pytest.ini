[pytest]
testpaths = .
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --cov=mytts
    --cov-report=term-missing
    --cov-report=html
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, may require server)
    durability: Durability tests (error recovery, resilience)
    slow: Slow tests (skip with -m "not slow")
