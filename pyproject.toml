[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mytts"
version = "0.1.0"
description = "Self-hosted text-to-speech toolchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "TTS>=0.21.0",
    "numpy>=1.24.0",
    "sounddevice>=0.4.0",
    "click>=8.0.0",
    "requests>=2.31.0",
    "httpx>=0.25.0",
    "scipy>=1.11.0",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
mytts = "mytts.cli:main"

[tool.ruff]
line-length = 100
