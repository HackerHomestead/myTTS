[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mytts"
version = "0.1.0"
description = "Self-hosted text-to-speech toolchain"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.22.0",
    "click>=8.0.0",
    "requests>=2.31.0",
    "sounddevice>=0.4.0",
]

[project.optional-dependencies]
server = [
    "TTS>=0.21.0",
    "sounddevice>=0.4.0",
    "scipy>=1.11.2",
    "fastapi>=0.104.0",
    "uvicorn>=0.24.0",
]

[project.scripts]
mytts = "mytts.cli:main"

[tool.setuptools]
packages = ["mytts", "mytts.engine"]
